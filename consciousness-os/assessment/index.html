<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>意识模式测试 · Consciousness OS</title><link rel="stylesheet" href="/consciousness-os/styles.css"><style>.assessment{max-width:780px;margin:70px auto}.progress{height:4px;background:#181d28;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .25s}.card{margin-top:22px;border:1px solid var(--line);background:rgba(8,10,16,.9);padding:clamp(20px,4vw,38px)}.kicker{font:600 11px ui-monospace,monospace;letter-spacing:.16em;color:var(--muted)}#prompt{font-size:clamp(25px,4vw,38px);line-height:1.25;margin:15px 0 24px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid #252b38;padding:15px;border-radius:9px;cursor:pointer}.option:has(input:checked){border-color:var(--pink);background:rgba(255,79,165,.08)}.option input{margin-top:4px;accent-color:var(--pink)}.wizard-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.wizard-actions button{min-height:45px;border:1px solid #303746;background:#0e131d;color:#fff;border-radius:8px;padding:0 18px}.wizard-actions .next{background:var(--pink);color:#09060a;border-color:var(--pink);font-weight:800}.wizard-actions button:disabled{opacity:.35;cursor:not-allowed}.meta{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font:12px ui-monospace,monospace}</style></head><body><main class="shell assessment"><nav class="nav"><a href="/consciousness-os/" style="text-decoration:none">← CONSCIOUSNESS OS</a><div>ASSESSMENT / 反思框架</div></nav><section class="card"><div class="progress"><i id="progress"></i></div><div class="meta"><span id="step"></span><span>约 2 分钟</span></div><div class="kicker" style="margin-top:28px">SCENARIO</div><h1 id="prompt"></h1><form id="form"><div id="options" class="options"></div><div class="wizard-actions"><button type="button" id="back">上一步</button><button type="submit" class="next" id="next">下一步</button></div></form></section><p class="footnote">请选择更接近“第一反应”的答案，而不是你认为更正确的答案。测试仅用于自我观察，不构成心理或医学诊断。</p></main><script type="module" src="/consciousness-os/assessment/app.mjs"></script></body></html>
